<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Responsive Image Gallery</title>
<style>
  body {
    font-family: Arial, sans-serif;
    margin: 0;
    padding: 40px;
    background-color:  #F5F5DC;
    text-align: center;
  }
  h1 { margin-bottom: 20px; }
  .filter-buttons {
    margin-bottom: 20px;
  }
  .filter-buttons button {
    padding: 8px 15px;
    margin: 5px;
    border: none;
    border-radius: 4px;
    cursor: pointer;
    background: #007BFF;
    color: white;
  }
  .gallery {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 15px;
  }
  .gallery img {
    width: 200px;
    height: auto;
    cursor: pointer;
    border-radius: 8px;
    transition: transform 0.2s;
  }
  .gallery img:hover {
    transform: scale(1.05);
  }
  /* Modal */
  .modal {
    display: none;
    position: fixed;
    z-index: 1000;
    left: 0; top: 0;
    width: 100%; height: 100%;
    background-color: rgba(0, 0, 0, 0.9);
  }
  .modal-content {
    display: block;
    margin: auto;
    max-width: 90%;
    max-height: 80vh;
  }
  .close, .prev, .next {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    color: white;
    font-size: 40px;
    font-weight: bold;
    cursor: pointer;
    user-select: none;
    padding: 10px;
  }
  .close { top: 20px; right: 30px; font-size: 35px; transform: none; }
  .prev { left: 20px; }
  .next { right: 20px; }
  .prev:hover, .next:hover, .close:hover {
    color: red;
  }
  #caption {
    color: #ccc;
    margin-top: 10px;
  }
  /* Responsive */
  @media (max-width: 768px) {
    .gallery img { width: 140px; }
  }
  @media (max-width: 480px) {
    .gallery img { width: 100px; }
  }
</style>
</head>
<body>

<h1>Responsive Image Gallery</h1>

<div class="filter-buttons">
  <button data-filter="all">All</button>
  <button data-filter="nature">Nature</button>
  <button data-filter="animals">Animals</button>
  <button data-filter="people">People</button>
</div>

<div class="gallery">
  <img src="image1.jpg" alt="Mountain" data-category="nature">
  <img src="image2.jpg" alt="Forest" data-category="nature">
  <img src="image3.jpg" alt="Lion" data-category="animals">
  <img src="image4.jpg" alt="Elephant" data-category="animals">
  <img src="image5.jpg" alt="Portrait" data-category="people">
  <img src="image6.jpg" alt="Beach" data-category="nature">
</div>

<!-- Modal -->
<div id="modal" class="modal">
  <span class="close">&times;</span>
  <span class="prev">&#10094;</span>
  <img class="modal-content" id="modal-img">
  <span class="next">&#10095;</span>
  <div id="caption"></div>
</div>

<script>
const modal = document.getElementById("modal");
const modalImg = document.getElementById("modal-img");
const caption = document.getElementById("caption");
const closeBtn = document.querySelector(".close");
const prevBtn = document.querySelector(".prev");
const nextBtn = document.querySelector(".next");
const images = document.querySelectorAll(".gallery img");

let currentIndex = 0;

// Open Modal
images.forEach((img, index) => {
  img.addEventListener("click", () => {
    currentIndex = index;
    openModal();
  });
});

function openModal() {
  modal.style.display = "block";
  modalImg.src = images[currentIndex].src;
  caption.textContent = images[currentIndex].alt;
}

// Navigation
prevBtn.addEventListener("click", () => {
  currentIndex = (currentIndex - 1 + images.length) % images.length;
  openModal();
});
nextBtn.addEventListener("click", () => {
  currentIndex = (currentIndex + 1) % images.length;
  openModal();
});

// Close
closeBtn.onclick = () => modal.style.display = "none";
window.onclick = (e) => { if (e.target === modal) modal.style.display = "none"; };

// Filtering
document.querySelectorAll(".filter-buttons button").forEach(btn => {
  btn.addEventListener("click", () => {
    const filter = btn.getAttribute("data-filter");
    images.forEach(img => {
      img.style.display = (filter === "all" || img.dataset.category === filter) ? "block" : "none";
    });
  });
});
</script>

</body>
</html>
